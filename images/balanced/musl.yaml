# Hardened busybox shell on musl. busybox (static, network daemons and suid
# support removed) is built by melange (melange/busybox.yaml); musl is
# Alpine's, which carries Alpine's security backports.
include: flavors/musl.yaml

contents:
  packages:
    - busybox
    - musl

entrypoint:
  command: /bin/sh

annotations:
  org.opencontainers.image.title: balanced
  org.opencontainers.image.description: "Hardened busybox shell on musl"

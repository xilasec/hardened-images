# Node.js 24 (LTS) runtime on musl. node is Alpine's signed build; the sqlite,
# nghttp2 and busybox it pulls in are our newer builds (melange/flavors.yaml).
# No npm: install dependencies in a build stage and copy node_modules in.
include: flavors/musl.yaml

contents:
  packages:
    - ca-certificates-bundle
    - nodejs

entrypoint:
  command: /usr/bin/node

annotations:
  org.opencontainers.image.title: node24
  org.opencontainers.image.description: "Node.js 24 runtime on musl, no npm"

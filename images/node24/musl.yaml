# Node.js 24 (LTS) runtime on musl, straight from Alpine's signed index. node
# lands at /usr/bin/node, same path as the glibc flavor. No npm: it is a
# build-time tool and its bundled dependencies carry their own CVE stream;
# install dependencies in a build stage and copy node_modules in.
include: flavors/musl.yaml

contents:
  packages:
    - ca-certificates-bundle
    - nodejs

entrypoint:
  command: /usr/bin/node

annotations:
  org.opencontainers.image.title: node24
  org.opencontainers.image.description: "Node.js 24 runtime on musl, no npm"

name: ubuntu-node24
version: noble

# Architectures this image supports. The builder picks one at build time (the
# host arch by default, or ARCH=arm64/amd64 to override) and selects the right
# apt mirror and Node tarball for it. amd64 builds natively on x86 hosts/CI,
# arm64 builds natively on Apple Silicon - neither needs emulation.
arch:
  - amd64
  - arm64

# Runtime libraries the upstream Node binary dynamically links against
# (libstdc++, libgcc). ca-certificates provides the OS trust store for any
# tooling that relies on it (Node itself bundles its own CA set).
packages:
  - ca-certificates
  - libstdc++6
  - libgcc-s1

# Node.js 24 (LTS) is not in noble's apt repositories, so rather than wiring in
# a third-party apt source we fetch the official upstream binary tarball and pin
# it by sha256. Reproducible and fully transparent: the exact bytes are verified
# before they ever touch the rootfs.
#
# Extracted into /usr with strip-components: 1 so node lands at /usr/bin/node -
# the same path as the Alpine node24 image, so consumers get a stable interface
# regardless of base. url/sha256 are keyed by arch; the builder picks the entry
# matching the build arch.
tarballs:
  - url:
      amd64: https://nodejs.org/dist/v24.16.0/node-v24.16.0-linux-x64.tar.xz
      arm64: https://nodejs.org/dist/v24.16.0/node-v24.16.0-linux-arm64.tar.xz
    sha256:
      amd64: d804845d34eddc21dc1092b519d643ef40b1f58ec5dec5c22b1f4bd8fabde6c9
      arm64: 524659219d6a207a7400f2bde15d19ba060ffbe0d32a8643319ad67e3bb64c78
    strip-components: 1
    dest: /usr

entrypoint:
  uid: 1000
  command: /usr/bin/node

accounts:
  users:
    - username: appuser
      uid: 1000
      groups:
        - { groupname: "appuser", gid: 1000 }

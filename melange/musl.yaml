package:
  name: musl
  version: 1.2.6
  epoch: 1
  description: Lightweight C standard library targeting correctness and safety
  copyright:
    - license: MIT
  checks:
    disabled:
      - usrmerge

# Repositories and keyrings come from flavors/<flavor>.yaml via
# scripts/packages.sh. Only built for flavors whose images request musl@local
# (today: musl).
environment:
  contents:
    packages:
      - busybox
      - build-base
      - linux-headers
      - ca-certificates-bundle

pipeline:
  - uses: fetch
    with:
      uri: https://musl.libc.org/releases/musl-${{package.version}}.tar.gz
      expected-sha256: d585fd3b613c66151fc3249e8ed44f77020cb5e6c1e635a616d3f9f82460512a
  - runs: |
      ./configure \
        --prefix=/usr \
        --syslibdir=/lib \
        --enable-optimize=speed
      make -j"$(nproc)"
      make DESTDIR="${{targets.destdir}}" install

  - uses: strip

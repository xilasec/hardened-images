name: Update lockfiles

# Nightly: re-resolve every image against the current Alpine/Wolfi indexes.
# When anything moved (security fixes, new releases, or an Alpine version
# that was pruned upstream), open/refresh a PR from bot/update-locks and run
# build.yaml on it. Merging that PR is what publishes updated images.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-locks
  cancel-in-progress: false

jobs:
  lock:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      BRANCH: bot/update-locks
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install apko
        run: scripts/install-tools.sh apko

      - name: Re-lock all images
        run: scripts/lock.sh all all

      - name: Open or update PR
        run: |
          if git diff --quiet -- images; then
            echo "Locks are current"; exit 0
          fi
          summary=$(git diff -U0 -- images | grep -E '^[+-]\s+"version"' | sort | uniq -c | head -50 || true)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git commit -am "locks: refresh package versions"
          git push --force origin "$BRANCH"
          # shellcheck disable=SC2016 # literal backticks in the PR body
          body=$(printf 'Automated nightly lock refresh.\n\n```\n%s\n```\n' "$summary")
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number -q '.[].number')" ]; then
            gh pr create --head "$BRANCH" --base "${{ github.event.repository.default_branch }}" \
              --title "locks: refresh package versions" --body "$body"
          else
            gh pr edit "$BRANCH" --body "$body"
          fi
          # Pushes made with GITHUB_TOKEN do not trigger workflows.
          gh workflow run build.yaml --ref "$BRANCH"

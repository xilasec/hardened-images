name: Build Hardened Images

# Daily: rescan published images, rebuild only those with fixable findings.
# Push to main: rebuild all, publish only what changed. PR: gate everything.
# Everything runs in one amd64 job (arm64 tests via qemu); publish jobs start
# only for images that passed and changed.

on:
  schedule:
    - cron: "0 4 * * *"
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]
  workflow_dispatch:
    inputs:
      mode:
        description: "scan: fixable findings only, diff: changed digests, all: gate everything"
        type: choice
        options: [diff, scan, all]
        default: diff
      image:
        description: "Image (directory under images/) or all"
        type: string
        default: all

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    outputs:
      publish: ${{ steps.ci.outputs.publish }}
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Policy tests
        if: github.event_name == 'pull_request'
        run: scripts/install-tools.sh opa && opa test policies

      - name: Check, build, gate
        id: ci
        env:
          MODE: ${{ github.event_name == 'schedule' && 'scan' || github.event_name == 'pull_request' && 'all' || inputs.mode || 'diff' }}
          IMAGE: ${{ inputs.image || 'all' }}
        run: |
          rc=0
          scripts/ci.sh "$MODE" "$IMAGE" || rc=$?
          echo "publish=$(cat dist/publish.json 2>/dev/null || echo '[]')" >> "$GITHUB_OUTPUT"
          exit $rc

      # Images that passed are published even if another one failed.
      - name: Upload tested results
        if: ${{ !cancelled() && steps.ci.outputs.publish != '[]' && github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested
          path: |
            dist/*.digest
            dist/sbom-*.json
            images/*/*.lock.json
          retention-days: 7

  publish:
    needs: check
    if: ${{ !cancelled() && needs.check.outputs.publish != '' && needs.check.outputs.publish != '[]' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    name: publish ${{ matrix.image }} ${{ matrix.flavor }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      # GHCR denies a second job pushing to a package created seconds earlier
      # by its sibling. Serial costs wall time only, not minutes.
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.check.outputs.publish) }}
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tested

      - run: scripts/install-tools.sh apko cosign

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push, sign, attest
        id: push
        run: scripts/publish.sh push ${{ matrix.image }} ${{ matrix.flavor }}

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Move ${{ matrix.flavor }} tag
        run: scripts/publish.sh promote ${{ matrix.image }} ${{ matrix.flavor }} "${{ steps.push.outputs.digest }}"

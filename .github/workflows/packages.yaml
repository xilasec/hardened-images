name: Build melange packages

# Builds melange packages whose recipe, patches or flavor repos changed, on
# native runners, commits them to the branch and re-runs the image build.
# A cheap check job runs first; nothing else starts when nothing is stale.

on:
  push:
    branches-ignore: [main]
    paths: ["melange/**", "flavors/**", "images/*/*.yaml"]
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild every package"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      stale: ${{ steps.stale.outputs.stale }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: stale
        env:
          FORCE: ${{ inputs.force }}
        run: |
          . scripts/lib.sh
          for f in $FLAVORS; do for a in $(flavor_archs "$f"); do
            [ -n "$(recipes_for_flavor "$f")" ] || continue
            if [ "$FORCE" = true ] || ! scripts/packages.sh "$f" "$a" --check >&2; then
              jq -nc --arg f "$f" --arg a "$a" '{flavor: $f, arch: $a}'
            fi
          done; done | jq -sc . > stale.json
          echo "stale=$(cat stale.json)" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.stale != '[]'
    name: ${{ matrix.flavor }} ${{ matrix.arch }}
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      matrix:
        include: ${{ fromJSON(needs.check.outputs.stale) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # SOURCE_DATE_EPOCH comes from recipe commit times

      - name: Install melange + bubblewrap
        run: |
          scripts/install-tools.sh melange
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build
        env:
          MELANGE_KEY: ${{ secrets.MELANGE_SIGNING_KEY }}
          FORCE: ${{ inputs.force }}
        run: |
          umask 077
          export MELANGE_SIGNING_KEY="$RUNNER_TEMP/melange.rsa"
          printf '%s\n' "$MELANGE_KEY" > "$MELANGE_SIGNING_KEY"
          if [ "$FORCE" = true ]; then rm -f packages/${{ matrix.flavor }}/${{ matrix.arch }}/*.inputs; fi
          scripts/packages.sh ${{ matrix.flavor }} ${{ matrix.arch }}
          rm -f "$MELANGE_SIGNING_KEY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ matrix.flavor }}-${{ matrix.arch }}
          path: packages/${{ matrix.flavor }}/${{ matrix.arch }}
          retention-days: 7

  commit:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: packages-*
          path: artifacts

      - name: Commit
        id: commit
        run: |
          for d in artifacts/packages-*; do
            n=${d#artifacts/packages-}
            rm -rf "packages/${n%-*}/${n##*-}"
            mkdir -p "packages/${n%-*}"
            cp -r "$d" "packages/${n%-*}/${n##*-}"
          done
          git add packages
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "packages: rebuild melange packages"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - if: steps.commit.outputs.changed == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: packages/*/*/*.apk

      # GITHUB_TOKEN pushes do not trigger workflows. Our packages can reach
      # any image through dependencies, so gate them all.
      - if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yaml --ref "$GITHUB_REF_NAME" -f mode=all

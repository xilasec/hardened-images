name: Build melange packages

# Rebuilds the locally maintained packages (melange/*.yaml) that images request
# as `<name>@local`, for every flavor and arch on native runners, then commits
# the signed .apk files, the re-generated lockfiles and the provenance back to
# the branch and dispatches build.yaml on it.
#
# Packages are rebuilt only when their recipe, patches or flavor repositories
# changed (see scripts/packages.sh); `force` rebuilds everything, e.g. to
# replace packages that were built outside CI.

on:
  push:
    branches-ignore: [main]
    paths:
      - "melange/**"
      - "flavors/**"
      - "images/*/*.yaml"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild every package even if its inputs are unchanged"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.flavor }} ${{ matrix.arch }}
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: true
      matrix:
        flavor: [musl, glibc]
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # SOURCE_DATE_EPOCH comes from recipe commit times

      - name: Install melange + bubblewrap
        run: |
          scripts/install-tools.sh melange
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap
          # Ubuntu 24.04 blocks unprivileged user namespaces, which melange's
          # bubblewrap runner needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build stale packages
        env:
          MELANGE_KEY: ${{ secrets.MELANGE_SIGNING_KEY }}
          FORCE: ${{ inputs.force }}
        run: |
          umask 077
          export MELANGE_SIGNING_KEY="$RUNNER_TEMP/melange.rsa"
          printf '%s\n' "$MELANGE_KEY" > "$MELANGE_SIGNING_KEY"
          if [ "$FORCE" = true ]; then rm -f packages/${{ matrix.flavor }}/${{ matrix.arch }}/*.inputs; fi
          scripts/packages.sh ${{ matrix.flavor }} ${{ matrix.arch }}
          rm -f "$MELANGE_SIGNING_KEY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ matrix.flavor }}-${{ matrix.arch }}
          path: packages/${{ matrix.flavor }}/${{ matrix.arch }}
          if-no-files-found: ignore
          retention-days: 7

  commit:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Collect packages
        run: |
          for f in musl glibc; do for a in x86_64 aarch64; do
            rm -rf "packages/$f/$a"
          done; done

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: packages-*
          path: artifacts

      - name: Place packages
        run: |
          for d in artifacts/packages-*; do
            n=${d#artifacts/packages-}
            mkdir -p "packages/${n%-*}"
            cp -r "$d" "packages/${n%-*}/${n##*-}"
          done
          find packages -type f | sort

      - name: Re-lock images
        run: |
          scripts/install-tools.sh apko
          scripts/lock.sh all all --local-only

      - name: Commit
        id: commit
        run: |
          git add packages images
          if git diff --cached --quiet; then
            echo "Nothing changed"; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "packages: rebuild melange packages and re-lock images"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Package provenance
        if: steps.commit.outputs.changed == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: packages/*/*/*.apk

      # Pushes made with GITHUB_TOKEN do not trigger workflows; dispatch the
      # image build explicitly so the new commit gets checked.
      - name: Build images on the new commit
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yaml --ref "$GITHUB_REF_NAME"
